[package]
name = "roose"
version = "0.1.0"
edition = "2024"

[dependencies]
fastrand = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
tiny-skia = "0.12"
wayland-client = "0.31"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
